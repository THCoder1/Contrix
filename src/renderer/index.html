<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; script-src 'self';"
  >

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Auto Escandinavia — Compraventa</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main class="app">

    <header class="app-header">
      <div>
        <h1>Auto Escandinavia</h1>
        <p>Contrato de compraventa y garantía de vehículo de ocasión (V.O.)</p>
      </div>
    </header>

    <section class="contract-container">

      <div class="page-title">
        <h2>Nuevo contrato</h2>
        <p>Introduzca los datos del comprador y del vehículo.</p>
      </div>

      <!-- DATOS DEL CONTRATO -->

      <section class="form-section">

        <div class="section-header">
          <h3>Datos del contrato</h3>
        </div>

        <div class="form-grid">

          <div class="form-group">
            <label for="contractDate">Fecha</label>
            <input type="date" id="contractDate">
          </div>

          <div class="form-group">
            <label for="contractTime">Hora</label>
            <input type="time" id="contractTime">
          </div>

          <div class="form-group full-width">
            <label for="contractLocation">Lugar</label>
            <input
              type="text"
              id="contractLocation"
              value="Málaga"
            >
          </div>

        </div>

      </section>


      <!-- COMPRADOR -->

      <section class="form-section">

        <div class="section-header">
          <h3>Datos del comprador</h3>
        </div>

        <div class="form-grid">

          <div class="form-group full-width">
            <label for="buyerName">Nombre y apellidos</label>
            <input type="text" id="buyerName">
          </div>

          <div class="form-group">
            <label for="buyerDni">DNI / NIE</label>
            <input type="text" id="buyerDni">
          </div>

          <div class="form-group">
            <label for="buyerPhone">N.º de teléfono</label>
            <input type="tel" id="buyerPhone">
          </div>

          <div class="form-group full-width">
            <label for="buyerAddress">Calle y N.º</label>
            <input type="text" id="buyerAddress">
          </div>

          <div class="form-group">
            <label for="buyerCity">Ciudad</label>
            <input type="text" id="buyerCity">
          </div>

          <div class="form-group">
            <label for="buyerPostalCode">Código postal</label>
            <input type="text" id="buyerPostalCode">
          </div>

          <div class="form-group">
            <label for="buyerProvince">Provincia</label>
            <input type="text" id="buyerProvince">
          </div>

          <div class="form-group full-width">
            <label for="buyerEmail">Correo electrónico</label>
            <input type="email" id="buyerEmail">
          </div>

        </div>

      </section>


      <!-- VEHÍCULO -->

      <section class="form-section">

        <div class="section-header">
          <h3>Datos del vehículo</h3>
        </div>

        <div class="form-grid">

          <div class="form-group">
            <label for="vehicleMake">Marca</label>
            <input type="text" id="vehicleMake">
          </div>

          <div class="form-group">
            <label for="vehicleModel">Modelo</label>
            <input type="text" id="vehicleModel">
          </div>

          <div class="form-group">
            <label for="vehicleRegistration">Matrícula</label>
            <input type="text" id="vehicleRegistration">
          </div>

          <div class="form-group">
            <label for="vehicleVin">N.º de bastidor</label>
            <input type="text" id="vehicleVin">
          </div>

          <div class="form-group">
            <label for="vehicleMileage">Kilometraje</label>
            <input type="number" id="vehicleMileage">
          </div>

          <div class="form-group">
            <label for="vehicleFirstRegistration">
              Fecha de 1.ª matriculación
            </label>
            <input type="date" id="vehicleFirstRegistration">
          </div>

        </div>

      </section>


      <!-- PRECIO -->

      <section class="form-section">

        <div class="section-header">
          <h3>Precio de la compraventa</h3>
        </div>

        <div class="form-grid">

          <div class="form-group price-field">

            <label for="salePrice">
              Precio de la compraventa (€)
            </label>

            <input
              type="number"
              id="salePrice"
              min="0"
              step="0.01"
            >

          </div>

        </div>

      </section>


      <!-- DECLARACIONES -->

      <section class="form-section">

        <div class="section-header">
          <h3>Manifestaciones del comprador</h3>
        </div>

        <label class="checkbox-row">
          <input
            type="checkbox"
            id="buyerInspected"
          >
          <span>
            Ha examinado personalmente y directamente el vehículo.
          </span>
        </label>

        <label class="checkbox-row">
          <input
            type="checkbox"
            id="buyerTested"
          >
          <span>
            Ha probado el vehículo.
          </span>
        </label>

        <label class="checkbox-row">
          <input
            type="checkbox"
            id="buyerAcceptsCondition"
          >
          <span>
            Está conforme con el estado interior y exterior del vehículo.
          </span>
        </label>

      </section>


      <!-- ACCIONES -->

      <section class="form-actions">

        <button
          type="button"
          id="generateContract"
          class="primary-button"
        >
          Generar contrato
        </button>

        <button
            type="button"
            id="createInvoiceFromContract"
            class="primary-button"
        >
            Crear factura desde contrato
        </button>

      </section>

    </section>

  </main>

  <script src="app.js"></script>

</body>
</html>
